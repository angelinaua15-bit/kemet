<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Кемет — кінематографічна історія Стародавнього Єгипту: піраміди, фараони, боги, гробниці, ієрогліфи.">
<title>Кемет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky full-bleed WebGL "film" of ten scenes driven by scroll (or the Play button), a fixed gold-dust layer over everything, then chronology, cartouche and quiz on the same ground */
:root{
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-glyph:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --bg:#0a0806; --ink:#f6efdf; --muted:#d6cab2; --gold:#e6bf6c; --line:rgba(246,239,223,.16);
  color-scheme:dark;
  background:#0a0806;
}
body{
  --bg:#0a0806; --bg2:#15100a; --ink:#f7f0e1; --muted:#d6cab2; --gold:#e6bf6c; --gold-2:#f6dc98;
  --line:rgba(247,240,225,.16); --chip:rgba(10,8,6,.72); --barbg:rgba(10,8,6,.62);
  --tshadow:0 1px 3px rgba(0,0,0,.7);
  --sheen:linear-gradient(100deg,#a57a35 0%,#f7dd9a 18%,#cf9f4a 36%,#fff4cf 50%,#b98839 64%,#efcd80 82%,#a57a35 100%);
  --ok:#8fd1b2; --bad:#e58a72;
  color-scheme:dark;
}
body[data-skin="light"]{
  --bg:#f4ebd8; --bg2:#ebdfc4; --ink:#1b140a; --muted:#4f402a; --gold:#8c5f16; --gold-2:#b07a22;
  --line:rgba(27,20,10,.17); --chip:rgba(252,247,236,.9); --barbg:rgba(244,235,216,.78);
  --tshadow:0 0 3px rgba(244,235,216,.9);
  --sheen:linear-gradient(100deg,#6b450c 0%,#b8862f 18%,#7a5214 36%,#d6a54d 50%,#6b450c 64%,#a8782a 82%,#6b450c 100%);
  --ok:#1f7a55; --bad:#a8432a;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .6s,color .6s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:999px}
.glyph{font-family:var(--f-glyph)}
.gold{background:var(--sheen);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none}
@keyframes sheen{from{background-position:0% 50%}to{background-position:260% 50%}}

/* ---------- top bar ---------- */
.bar{position:fixed;z-index:50;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 26px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:linear-gradient(to bottom,var(--barbg),transparent);pointer-events:none}
.bar>*{pointer-events:auto}
.logo{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.34em;text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:center;text-shadow:var(--tshadow)}
.logo .glyph{font-size:22px;letter-spacing:0;color:var(--gold)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--chip);}
.seg button{all:unset;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.08em;padding:6px 11px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--chip);color:var(--ink);}
.icon-btn svg{width:18px;height:18px}
.play{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.06em;padding:10px 18px 10px 14px;border-radius:999px;color:#1b1206;background:var(--sheen);background-size:260% 100%;background-position:30% 50%;box-shadow:0 6px 30px rgba(230,191,108,.35)}
.play svg{width:14px;height:14px}
.pill{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--chip);text-decoration:none;}
@media (max-width:760px){ .pill{display:none} .bar .play span{display:none} .bar .play{padding:10px 12px} .logo{font-size:18px;letter-spacing:.24em} }
.progress{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--sheen);background-size:260% 100%;z-index:60}

/* ---------- gold dust layer ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ---------- story ---------- */
#story{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.fallback{position:absolute;inset:0;z-index:0}
.fallback img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.fallback img.on{opacity:.7}

.panel{position:absolute;z-index:4;left:0;top:0;bottom:0;width:min(660px,100%);display:flex;flex-direction:column;justify-content:center;gap:20px;padding-left:max(clamp(24px,6vw,96px),env(safe-area-inset-left,0px));padding-right:24px;padding-block:96px 90px;pointer-events:none;text-shadow:var(--tshadow)}
.panel .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.panel h2{font-size:clamp(46px,6.2vw,96px);font-weight:500;color:var(--ink)}
.panel .w{display:inline-block}
.panel.live .w{will-change:transform,opacity}
.panel h2 em{font-style:italic;font-weight:600}
.panel .body{font-size:clamp(16.5px,1.25vw,18.5px);line-height:1.68;font-weight:500;color:var(--ink);max-width:44ch}
.panel .chips{display:flex;flex-wrap:wrap;gap:10px}
.panel .chip{border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--chip);text-shadow:none}
.panel .chip b{font-weight:700;color:var(--gold);margin-right:7px}
.panel .ghost{position:absolute;z-index:-1;left:max(clamp(8px,3vw,60px),env(safe-area-inset-left,0px));top:50%;margin-top:-30vh;font-size:56vh;line-height:1;opacity:.13;pointer-events:none;text-shadow:none;will-change:transform}
.panel .ghost span{display:block}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-22px) rotate(3deg)}}
.panel.hero .kemet{font-size:clamp(72px,11vw,176px);font-weight:700;letter-spacing:.08em;line-height:.86;display:flex;flex-wrap:nowrap}
.panel.hero h2{font-size:clamp(34px,3.6vw,56px)}
.panel .actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px;pointer-events:auto}
.hint{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:var(--muted)}
.mouse{flex:none;width:20px;height:32px;border:1.5px solid var(--muted);border-radius:12px;position:relative}
.mouse::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:6px;margin-left:-1px;border-radius:2px;background:var(--gold);animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(10px);opacity:0}100%{opacity:0}}

.hud{position:absolute;z-index:4;left:max(clamp(24px,6vw,96px),env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px;color:var(--muted);text-shadow:var(--tshadow)}
.counter{display:flex;align-items:center;gap:14px;letter-spacing:.14em;font-variant-numeric:tabular-nums;font-weight:600}
.counter .track{width:140px;height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.counter .track i{position:absolute;inset:0;background:var(--sheen);background-size:260% 100%;transform-origin:0 50%;transform:scaleX(0)}
.counter b{color:var(--ink)}
.tc{white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.tc i{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.credit{font-size:11px;text-align:right;max-width:40vw}
.chapters{position:absolute;z-index:4;right:max(24px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;list-style:none;margin:0;padding:0;text-shadow:var(--tshadow)}
.chapters button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:5px 0;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);opacity:.75;transition:color .3s,opacity .3s}
.chapters button i{display:block;width:14px;height:2px;border-radius:2px;background:currentColor;transition:width .4s}
.chapters button span{opacity:0;transform:translateX(6px);transition:opacity .3s,transform .3s}
.chapters:hover button span,.chapters button.on span{opacity:1;transform:none}
.chapters button.on{color:var(--ink);opacity:1}
.chapters button.on i{width:36px;background:var(--gold)}
.chapters button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:65;transition:opacity .8s}
.loader.done{opacity:0;pointer-events:none}
.loader div{display:grid;justify-items:center;gap:14px}
.loader .glyph{font-size:64px;animation:floaty 3s ease-in-out infinite}
.loader .bar2{width:160px;height:2px;background:var(--line);overflow:hidden}
.loader .bar2 i{display:block;height:100%;background:var(--sheen);background-size:260% 100%;transform-origin:0 50%;transform:scaleX(0);transition:transform .3s}
.loader small{font-size:11px;letter-spacing:.3em;color:var(--muted)}

@media (max-width:760px){
  .panel{top:auto;width:100%;justify-content:flex-end;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-top:34vh;gap:13px}
  .panel h2{font-size:clamp(38px,11vw,54px)}
  .panel.hero .kemet{font-size:clamp(60px,18vw,86px)}
  .panel.hero h2{font-size:clamp(28px,8vw,38px)}
  .panel .body{font-size:15.5px;line-height:1.6}
  .panel.hero .body{display:none}
  .panel .ghost{font-size:40vh;top:6vh;margin-top:0;left:auto;right:4vw}
  .chapters{display:none}
  .credit{display:none}
  .tc .tot{display:none}
  .counter .track{width:80px}
}

/* ---------- after the story ---------- */
.sec{position:relative;z-index:4;padding-block:clamp(90px,12vw,170px);border-top:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sec h2{font-size:clamp(46px,6vw,92px);margin-top:16px}
.sec h2 em{font-style:italic;font-weight:600}
.sec .intro{font-size:18px;color:var(--muted);max-width:56ch;margin-top:20px;font-weight:500}
.rv{transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.hide{opacity:0;transform:translateY(40px)}

.eras{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.era{background:var(--bg);padding:30px 28px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden;transition:background .4s}
.era::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--sheen);background-size:260% 100%;transform:scaleX(0);transform-origin:0 50%;transition:transform .6s}
.era:hover::after{transform:scaleX(1);animation:sheen 4s linear infinite}
.era:hover{background:var(--bg2)}
.era .yr{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gold);font-variant-numeric:tabular-nums}
.era h3{font-size:32px;font-weight:600}
.era p{color:var(--muted);font-size:15px}
@media (max-width:900px){.eras{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.eras{grid-template-columns:minmax(0,1fr)}}

.writer{margin-top:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px;align-items:center}
@media (max-width:820px){.writer{grid-template-columns:minmax(0,1fr)}}
.writer label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px}
.writer input{width:100%;font:inherit;font-family:var(--f-display);font-weight:600;font-size:36px;padding:10px 2px;border:0;border-bottom:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:0}
.writer input:focus{outline:none;border-color:var(--gold)}
.writer .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.cwrap{overflow-x:auto;padding:16px 18px}
.cartouche{display:inline-flex;align-items:flex-end;gap:8px;padding:24px 42px 20px 32px;border:3px solid var(--gold);border-radius:999px;position:relative;min-height:126px;box-shadow:0 0 50px rgba(230,191,108,.18),inset 0 0 40px rgba(230,191,108,.08)}
.cartouche::after{content:"";position:absolute;right:-13px;top:14%;bottom:14%;width:5px;border-radius:3px;background:var(--gold)}
.cartouche .g{display:grid;justify-items:center;gap:6px}
.cartouche .g span{font-family:var(--f-glyph);font-size:50px;line-height:1;animation:rise .55s cubic-bezier(.2,.9,.3,1.3) both}
.cartouche .g small{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
@keyframes rise{from{transform:translateY(18px) scale(.7);opacity:0}to{transform:none;opacity:1}}

.quiz{margin-top:44px;max-width:780px}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,3.4vw,44px);line-height:1.1;margin-bottom:24px}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.qopts{grid-template-columns:minmax(0,1fr)}}
.qopt{font:inherit;font-size:16px;font-weight:500;color:var(--ink);text-align:left;padding:15px 20px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.qopt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.qopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.qopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.qopt:disabled{cursor:default}
.qexp{margin-top:18px;color:var(--muted);min-height:26px;font-size:16px}
.qbtn{margin-top:22px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.06em;padding:13px 26px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}

footer{position:relative;z-index:4;border-top:1px solid var(--line);padding-block:80px calc(40px + env(safe-area-inset-bottom,0px))}
footer .big{font-family:var(--f-display);font-weight:700;font-size:clamp(76px,16vw,230px);line-height:.8;letter-spacing:.06em;display:flex;align-items:center;gap:.2em;flex-wrap:wrap}
footer .big .glyph{font-size:.6em;color:var(--gold);letter-spacing:0}
.credits{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 28px;font-size:12.5px;color:var(--muted)}
.credits a{text-decoration:none;border-bottom:1px solid var(--line)}
.credits a:hover{color:var(--ink)}


/* ---------- menu ---------- */
.menu-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--chip);}
.menu-btn i{display:grid;gap:4px}
.menu-btn i b{display:block;width:16px;height:1.5px;background:currentColor;border-radius:2px;transition:transform .35s}
.menu-open .menu-btn i b:first-child{transform:translateY(2.75px) rotate(45deg)}
.menu-open .menu-btn i b:last-child{transform:translateY(-2.75px) rotate(-45deg)}
@media (max-width:760px){ .menu-btn span{display:none} .menu-btn{padding:12px} }
.menu{position:fixed;inset:0;z-index:45;background:var(--bg);display:grid;align-content:center;padding-left:max(clamp(24px,8vw,140px),env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:100px 40px;clip-path:circle(0% at calc(100% - 60px) 36px);transition:clip-path .8s cubic-bezier(.7,0,.2,1);overflow-y:auto}
.menu-open .menu{clip-path:circle(150% at calc(100% - 60px) 36px)}
.menu ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:m}
.menu li{overflow:hidden}
.menu a{display:flex;align-items:baseline;gap:18px;text-decoration:none;font-family:var(--f-display);font-weight:500;font-size:clamp(28px,min(5.4vw,6.4vh),68px);line-height:1.08;color:var(--ink);transform:translateY(110%);transition:transform .7s cubic-bezier(.2,.8,.2,1),color .3s}
.menu a small{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--gold);font-variant-numeric:tabular-nums}
.menu a:hover{color:var(--gold)}
.menu-open .menu a{transform:none}
.menu .mglyph{position:absolute;right:6vw;bottom:4vh;font-size:38vh;line-height:1;opacity:.12;pointer-events:none}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:56px}
.stat{background:var(--bg);padding:34px 30px;display:grid;gap:8px;align-content:start;position:relative;overflow:hidden}
.stat .num{font-family:var(--f-display);font-weight:700;font-size:clamp(54px,6vw,92px);line-height:.9;font-variant-numeric:tabular-nums}
.stat .lab{font-size:15px;font-weight:700;color:var(--ink)}
.stat p{font-size:14.5px;color:var(--muted)}
.stat .sg{position:absolute;right:14px;top:6px;font-size:90px;opacity:.08;line-height:1}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}}

/* ---------- marquee ---------- */
.marq{position:relative;z-index:4;border-block:1px solid var(--line);padding-block:22px;overflow:hidden;display:grid;gap:14px;background:var(--bg2)}
.marq .row{display:flex;width:max-content;gap:0;animation:mq 70s linear infinite}
.marq .row.rev{animation-direction:reverse;animation-duration:85s}
.marq:hover .row{animation-play-state:paused}
.marq .row span{display:inline-flex;align-items:center;gap:22px;padding-right:22px;font-family:var(--f-display);font-size:clamp(20px,2.2vw,28px);font-weight:500;white-space:nowrap}
.marq .row span i{font-style:normal;font-family:var(--f-glyph);color:var(--gold);font-size:.9em}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- carousel ---------- */
.car-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.car-ctrl{display:flex;align-items:center;gap:12px}
.car-ctrl button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);background:var(--chip);transition:background .3s,color .3s,transform .2s}
.car-ctrl button:hover{background:var(--ink);color:var(--bg)}
.car-ctrl button:active{transform:scale(.94)}
.car-ctrl button svg{width:20px;height:20px}
.car-ctrl .cnt{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.car{position:relative;z-index:4;margin-top:40px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;perspective:1400px;padding-block:20px 30px}
.car::-webkit-scrollbar{display:none}
.car.drag{cursor:grabbing;scroll-snap-type:none}
.car-track{display:flex;gap:22px;width:max-content;padding-left:max(calc((100vw - 1180px)/2 + 16px), var(--gl));padding-right:max(calc((100vw - 1180px)/2 + 16px), var(--gr))}

.pc .ph{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;background:var(--bg2);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}

.pc .crt{position:absolute;z-index:2;right:14px;top:14px;font-family:var(--f-glyph);font-size:22px;color:#f6dc98;border:1.5px solid rgba(246,220,152,.8);border-radius:999px;padding:4px 12px 4px 10px;background:rgba(10,8,6,.35);}
.pc h3{font-size:34px;font-weight:600}
.pc .tag{font-family:var(--f-display);font-style:italic;font-size:20px;color:var(--gold);margin-top:-8px}
.pc p{font-size:15px;color:var(--muted)}
.car-bar{height:2px;background:var(--line);margin-top:6px;position:relative;overflow:hidden;border-radius:2px}
.car-bar i{position:absolute;inset:0;background:var(--sheen);background-size:260% 100%;transform-origin:0 50%;transform:scaleX(0)}

/* ---------- gods flip cards ---------- */
.gods{margin-top:52px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.gods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.gods{grid-template-columns:minmax(0,1fr)}}
.flip{all:unset;cursor:pointer;display:block;perspective:1200px;aspect-ratio:4/5;max-width:100%}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.flip.on .in{transform:rotateY(180deg)}
@media (hover:hover) and (pointer:fine){ .flip:hover .in{transform:rotateY(180deg)} .flip.on:hover .in{transform:rotateY(180deg)} }
.flip .f,.flip .b{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .f img{width:100%;height:100%;object-fit:cover}
.flip .f::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,6,.88),rgba(10,8,6,.05) 55%)}
.flip .f .cap{position:absolute;z-index:2;left:22px;right:22px;bottom:20px;display:grid;gap:4px;color:#f7f0e1}
.flip .f .cap small{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#f6dc98}
.flip .f .cap b{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1}
.flip .f .turn{position:absolute;z-index:2;right:16px;top:16px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,8,6,.4);color:#f7f0e1;border:1px solid rgba(247,240,225,.3);}
.flip .b{transform:rotateY(180deg);background:var(--bg2);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.flip .b .bg{font-size:88px;line-height:1}
.flip .b h3{font-size:36px;font-weight:600}
.flip .b small{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.flip .b p{font-size:15.5px;line-height:1.6;color:var(--ink)}
.flip:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:20px}

/* ---------- horizontal journey ---------- */
.hz{position:relative;z-index:4;border-top:1px solid var(--line)}
.hz-sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:26px}
.hz-head{padding-left:max(clamp(24px,6vw,96px),env(safe-area-inset-left,0px));padding-right:var(--gr);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hz-head h2{font-size:clamp(40px,5vw,76px);margin-top:10px}

.hz-track{display:flex;gap:28px;width:max-content;padding-left:max(clamp(24px,6vw,96px),env(safe-area-inset-left,0px));padding-right:12vw;will-change:transform}
.slide{flex:none;width:min(74vw,860px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:end}
.slide .im{all:unset;cursor:zoom-in;position:relative;display:block;height:min(58vh,560px);border-radius:22px;overflow:hidden;background:var(--bg2)}
.slide .im:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.slide .im img{position:absolute;top:0;left:-12%;width:124%;height:100%;object-fit:cover;will-change:transform}
.slide .tx{display:grid;gap:10px;padding-bottom:6px}

}

/* ---------- afterlife sticky ---------- */
.after{margin-top:50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px)}

.after-vis img.on{opacity:1;transform:scale(1)}
.after-vis .day{position:absolute;z-index:2;left:22px;bottom:20px;font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;color:#f6dc98;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.after-vis::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,6,.65),transparent 40%);pointer-events:none}
.steps2{display:grid}
.st2{min-height:72vh;display:flex;flex-direction:column;justify-content:center;gap:12px;opacity:.28;transition:opacity .6s}
.st2.on{opacity:1}
.st2 .d{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.st2 h3{font-size:clamp(34px,3.6vw,52px);font-weight:600}
.st2 p{font-size:17px;line-height:1.7;max-width:46ch}
@media (max-width:820px){
  .after{grid-template-columns:minmax(0,1fr);gap:0}
  .after-vis{top:70px;height:40vh;z-index:5}
  .st2{min-height:60vh}
}

/* ---------- museum ---------- */
.museum{margin-top:50px;columns:3 300px;column-gap:18px}
.mi{all:unset;cursor:zoom-in;display:block;break-inside:avoid;margin-bottom:18px;border-radius:18px;overflow:hidden;position:relative;background:var(--bg2);width:100%}
.mi img{display:block;width:100%;height:auto;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.mi:hover img{transform:scale(1.07)}
.mi .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 18px;background:linear-gradient(to top,rgba(10,8,6,.9),transparent);color:#f7f0e1;display:grid;gap:3px;transform:translateY(30%);opacity:0;transition:transform .5s,opacity .5s}
.mi:hover .cap,.mi:focus-visible .cap{transform:none;opacity:1}
.mi .cap b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.05}
.mi .cap small{font-size:12px;font-weight:700;letter-spacing:.1em;color:#f6dc98}
@media (hover:none){ .mi .cap{transform:none;opacity:1} }
.mi:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:80;background:rgba(6,5,3,.94);display:grid;grid-template-rows:1fr auto;padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .4s}
.lb.on{opacity:1;pointer-events:auto}
.lb figure{margin:0;display:grid;place-items:center;min-height:0}
.lb img{max-width:min(1100px,100%);max-height:72vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.94);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lb.on img{transform:none}
.lb .lbc{max-width:760px;margin:16px auto 0;text-align:center;color:#f7f0e1;display:grid;gap:6px}
.lb .lbc b{font-family:var(--f-display);font-size:30px;font-weight:600}
.lb .lbc p{font-size:15px;color:#d6cab2}
.lb .lbc small{font-size:11.5px;color:#a89c86}
.lb button{all:unset;cursor:pointer;position:absolute;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#f7f0e1;border:1px solid rgba(247,240,225,.3);background:rgba(10,8,6,.5)}
.lb button svg{width:20px;height:20px}
.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.lb .pv{left:max(16px,env(safe-area-inset-left,0px));top:45%}
.lb .nx{right:max(16px,env(safe-area-inset-right,0px));top:45%}
.lb button:focus-visible{outline:2px solid #e6bf6c}

@media (prefers-reduced-motion:reduce){.marq .row,.mouse::after,.cartouche .g span,.gold,.play,.panel .ghost span,.tc i,.loader .glyph{animation:none}}
</style>
</head>

/* ================= PANELS ================= */
const panels = $('#panels');
let P = [];
function splitWords(html){
  const withEm = html.replace(/<em>(.*?)<\/em>/g,(m,x)=>x.split(' ').map(w=>`<em class="w gold">${w}</em>`).join(' '));
  return withEm.split(/(<em class="w gold">.*?<\/em>|\s+)/).filter(x=>x && !/^\s+$/.test(x)).map(x=>x.startsWith('<em')?x:`<span class="w">${x}</span>`).join(' ');
}
function buildPanels(){
  panels.innerHTML = S.map((s,i)=>{
    const d = s[lang];
    const kem = s.hero ? `<h1 class="kemet" aria-label="${L().kemet}">${[...L().kemet].map(ch=>`<span class="w gold">${ch}</span>`).join('')}</h1>` : '';
    return `<article class="panel${s.hero?' hero':''}" data-i="${i}">
      <div class="ghost glyph" aria-hidden="true"><span class="gold">${s.g}</span></div>
      <div class="eyebrow" data-r>${d.eye}</div>
      ${kem}
      <h2>${splitWords(d.t)}</h2>
      <p class="body" data-r>${d.b}</p>
      <div class="chips" data-r>${d.c.map(c=>`<span class="chip"><b>${c[0]}</b>${c[1]}</span>`).join('')}</div>
      ${s.hero?`<div class="actions" data-r><button class="play" type="button" id="playHero"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg><span>${L().play}</span></button><div class="hint"><span class="mouse"></span>${L().hint}</div></div>`:''}
    </article>`;}).join('');
  P = [...panels.children].map(el=>({el, words:[...el.querySelectorAll('.w')], rest:[...el.querySelectorAll('[data-r]')], ghost:el.querySelector('.ghost')}));
  $('#chapters').innerHTML = S.map((s,i)=>`<li><button type="button" data-i="${i}" id="ch${i}"><span>${s[lang].short}</span><i></i></button></li>`).join('');
  const ph=$('#playHero'); if(ph) ph.addEventListener('click', togglePlay);
  lastUI = -1;
  updateUI(sceneProgress(), true);
}

const story = $('#story');
const STEP = 1.8;

let lenis = null;
try{ if(!RM && typeof Lenis!=='undefined'){ lenis = new Lenis({lerp:0.075, wheelMultiplier:0.9}); } }catch(e){ lenis=null; }
const curY = () => lenis ? lenis.animatedScroll : scrollY;
function goY(y, dur){ if(lenis) lenis.scrollTo(y,{duration:dur, immediate: dur===0, force:true}); else scrollTo({top:y, behavior:(RM||dur===0)?'auto':'smooth'}); }
function scrollToScene(i){ goY(story.offsetTop + i*STEP*innerHeight + 2, 1.8); }
$('#chapters').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ stopPlay(); scrollToScene(+b.dataset.i); } });
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{ const t=document.querySelector(a.getAttribute('href')); if(!t) return; e.preventDefault(); stopPlay(); lenis? lenis.scrollTo(t,{duration:1.8}) : t.scrollIntoView({behavior:RM?'auto':'smooth'}); }));
function sceneProgress(){ return Math.min(N-1, Math.max(0, (scrollY - story.offsetTop)/(STEP*innerHeight))); }

const storyEnd = () => story.offsetTop + (N-1)*STEP*innerHeight;
function syncPlay(){
  const atEnd = scrollY >= storyEnd() - 4;
  const label = playing ? L().pause : (atEnd ? L().replay : L().play);
  const icon = playing ? '<path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/>' : '<path d="M3 1.5v11l9-5.5z" fill="currentColor"/>';
  ['#playTop','#playHero'].forEach(id=>{ const b=$(id); if(!b) return; b.querySelector('svg').innerHTML=icon; b.querySelector('span').textContent=label; b.setAttribute('aria-label',label); });
}
function startPlay(){
  if(scrollY >= storyEnd()-4 || scrollY < story.offsetTop-10){ goY(story.offsetTop, 0); }
  playing = true; lastPT = performance.now(); syncPlay();
}
function stopPlay(){ if(!playing) return; playing=false; syncPlay(); }
function togglePlay(){ playing ? stopPlay() : startPlay(); }
$('#playTop').addEventListener('click', togglePlay);
['wheel','touchstart','keydown'].forEach(ev=>addEventListener(ev, e=>{ if(e.target && e.target.closest && e.target.closest('input,.play')) return; if(playing && !(ev==='keydown' && (e.key==='Tab'))) stopPlay(); }, {passive:true}));
function playTick(t){
  if(!playing) return;
  const dt = Math.min(200, t - lastPT); lastPT = t;
  const s = sceneProgress(), f = s - Math.floor(s);
  const slow = (f < 0.42) ? 0.6 : 1.25;
  const v = STEP*innerHeight/(SEC_PER_SCENE*1000) * slow;
  const y = curY() + v*dt;
  if(y >= storyEnd()){ goY(storyEnd(),0); playing=false; syncPlay(); return; }
  goY(y, 0);
}

const smooth = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
let lastUI = -1, intro = RM ? 1 : 0;
function tcode(sec){ const fr=Math.floor((sec%1)*24), s=Math.floor(sec)%60, m=Math.floor(sec/60)%60, h=Math.floor(sec/3600); return [h,m,s,fr].map(x=>String(x).padStart(2,'0')).join(':'); }
let lastS = -1, lastTC = '', lastIntro = -1;
function updateUI(s, force){
  if(!force && Math.abs(s-lastS) < 0.0004 && intro === lastIntro) return;
  lastS = s; lastIntro = intro;
  const i = Math.min(N-1, Math.floor(s+0.25));
  P.forEach((p,j)=>{
    const d = s - j;
    if (Math.abs(d) > 1.2 && j !== N-1 && !(j===0 && d<0)) { if(p.vis!==false){ p.vis=false; p.el.style.visibility='hidden'; p.el.style.opacity=0; p.el.setAttribute('aria-hidden','true'); p.el.classList.remove('live'); } return; }
    p.vis = true; p.el.classList.add('live');
    let o = j===0 ? 1 - smooth(0.36,0.52,d) : smooth(-0.14,-0.02,d) * (1 - smooth(0.36,0.52,d));
    if (j===N-1) o = smooth(-0.14,-0.02,d);
    if (RM) o = o>0.5?1:0;
    p.el.style.opacity = o;
    p.el.style.visibility = o<0.01 ? 'hidden' : 'visible';
    p.el.setAttribute('aria-hidden', o<0.5);
    const enter = j===0 && intro<1 ? intro : (d<0 ? smooth(-0.14,-0.01,d) : 1);
    const leave = d>0 ? smooth(0.32,0.52,d) : 0;
    p.words.forEach((w,k)=>{
      const e = Math.min(1, Math.max(0, enter*1.7 - k*0.07));
      const y = (1-e)*56 - leave*34*(1+k*0.12);
      w.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`;
      w.style.opacity = e;
    });
    p.rest.forEach((r,k)=>{ const e=Math.min(1,Math.max(0,enter*1.5 - 0.3 - k*0.08)); r.style.transform=`translate3d(0,${((1-e)*24 - leave*24).toFixed(1)}px,0)`; r.style.opacity = e; });
    if(p.ghost) p.ghost.style.transform = `translate3d(${(d*-60).toFixed(1)}px,${(d*-160).toFixed(1)}px,0) scale(${(1+Math.abs(d)*0.15).toFixed(3)})`;
  });
  if (i!==lastUI){
    lastUI=i;
    $('#cNum').textContent = String(i+1).padStart(2,'0');
    $('#credit').textContent = L().photo + ': ' + S[i].cr;
    document.querySelectorAll('#chapters button').forEach((b,k)=>b.classList.toggle('on',k===i));
  }
  $('#cBar').style.transform = `scaleX(${(s/(N-1)).toFixed(4)})`;
  const tcs = tcode(s*SEC_PER_SCENE); if(tcs!==lastTC){ lastTC=tcs; $('#tc').innerHTML = tcs + '<span class="tot"> / ' + tcode((N-1)*SEC_PER_SCENE) + '</span>'; }
}

const VS = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
const FS = `precision highp float;

uniform vec2 uIA,uIB,uCA,uCB; uniform float uSA,uSB,uFA,uFB,uUA,uUB,uKA,uKB;

float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

float edgeM(vec2 uv, float F){

vec2 par(sampler2D ax, vec2 uv, vec3 cam){

vec3 sceneCol(sampler2D ph, sampler2D pl, sampler2D ax, vec2 px, vec2 I, float S, vec2 C, float F, float K, vec3 cam, float u, float dir,

  float em = edgeM(uv, F);
  vec3 plc = texture2D(pl, cu).rgb;
  vec3 bg;

    if (uLight > 0.5) bg = mix(PAP, plc, em * (K > 0.5 ? 0.16 : 1.0));

  float streak = 0.12 + 0.75*r2*r2;
  vec2 pa = px, pb = px;

  if (kb > 0.0 && uP > 0.0) pb = q - vec2(kb*kb*streak*uRes.x*0.55, (r3-0.5)*kb*0.04*uRes.y);

  vec3 ca = sceneCol(uPhA,uPlA,uAxA, pa, uIA,uSA,uCA,uFA,uKA, uCamA, uUA, uDA, cell,bs,r,r2, mi, mdir);
  vec3 cb = ground();

    col *= 1.0 - (uPort > 0.5 ? 0.84 : 0.74)*dl;
    col *= 1.0 - 0.42*vig;

let prog=null, U={}, TX={}, black=null;
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function mkTex(src){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(src && src.naturalWidth) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  return t; }
const UN = ['uRes','uT','uP','uMS','uPort','uLight','uRay','uM','uPhA','uPlA','uAxA','uPhB','uPlB','uAxB','uIA','uIB','uCA','uCB','uSA','uSB','uFA','uFB','uUA','uUB','uKA','uKB','uCamA','uCamB','uDA','uDB'];
function initGL(){
  prog = gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error('link: '+gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  UN.forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  ['uPhA','uPlA','uAxA','uPhB','uPlB','uAxB'].forEach((n,i)=>gl.uniform1i(U[n],i));
  black = mkTex(null);
  keys.forEach(k=>{ TX[k] = {ph:mkTex(imgs[k]), pl:mkTex(plates[k]), ax:mkTex(auxs[k])}; });
}
let DPR=1;
let QS = 1, cvW = 0, cvH = 0;
function resize(){
  cvW = cv.clientWidth; cvH = cv.clientHeight;
  const cap = 1300 / Math.max(1, Math.max(cvW, cvH));
  DPR = Math.min(window.devicePixelRatio||1, 1, cap) * QS;
  cv.width=Math.max(2,Math.round(cvW*DPR)); cv.height=Math.max(2,Math.round(cvH*DPR));
  if(gl) gl.viewport(0,0,cv.width,cv.height);
}
function layout(s, zoom){
  const W=cv.width, H=cv.height, im=imgs[s.k];
  const iw=im.naturalWidth||1, ih=im.naturalHeight||1;
  const portrait = W/H < 0.85;
  if(!s.fit) return {i:[iw,ih], s:Math.max(W/iw,H/ih)*1.06*zoom, c:[W*0.5, H*0.5], f:0};
  const k = portrait ? 0.74 : s.sc;
  return {i:[iw,ih], s:Math.min(W/iw, H/ih)*k*zoom, c: portrait ? [W*0.5, H*0.62] : [W*s.cx, H*0.5], f:1};
}
function cam(s, f, t){
  const m = s.cam || [0.32, 0.06, 0.02];
  const breath = Math.sin(t*0.00035)*0.004;
  return [m[0]*f, (f-0.5)*m[1] + breath, (0.5-f)*m[2] + breath*0.5];
}
function bindSide(side, s, Lo, camv, u, dir){
  const base = side==='A'?0:3;
  const tx = TX[s.k];
  [tx.ph,tx.pl,tx.ax].forEach((t,i)=>{ gl.activeTexture(gl.TEXTURE0+base+i); gl.bindTexture(gl.TEXTURE_2D,t); });
  gl.uniform2f(U['uI'+side], Lo.i[0], Lo.i[1]); gl.uniform1f(U['uS'+side], Lo.s);
  gl.uniform2f(U['uC'+side], Lo.c[0], Lo.c[1]); gl.uniform1f(U['uF'+side], Lo.f); gl.uniform1f(U['uK'+side], s.cut);
  gl.uniform3f(U['uCam'+side], camv[0], camv[1], camv[2]); gl.uniform1f(U['uU'+side], u); gl.uniform1f(U['uD'+side], dir);
}
function render(t){
  const s = sceneProgress();
  const i = Math.min(N-1, Math.floor(s)), f = s - i;
  const A=S[i], B=S[Math.min(N-1,i+1)];
  let p = 0;
  if(i < N-1){ p = smooth(0.62, 1.0, f); if(RM) p = p>0.5?1:0; }
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uT, t*0.001);
  gl.uniform1f(U.uPort, cv.width/cv.height < 0.85 ? 1 : 0);
  gl.uniform1f(U.uLight, skin==='light' ? 1 : 0);
  gl.uniform1f(U.uRay, A.ray + (B.ray - A.ray)*p);
  const inA = i===0 ? (intro<1 ? smooth(0.2,1,intro) : 1) : smooth(0.0, 0.2, f);
  const outA = i<N-1 ? smooth(0.5, 0.86, f) : 0;
  const uA = RM ? 1 : inA * (1 - outA);
  const dirA = f < 0.45 ? -1 : 1;
  const bgP = (i===0 && intro<1) ? 0 : smooth(0.12,1,p);
  bindSide('A', A, layout(A, 1 + 0.05*f), cam(A, f, t), uA, dirA);
  bindSide('B', B, layout(B, 1), cam(B, 0, t), RM?1:0, -1);
  gl.uniform1f(U.uP, bgP);
  gl.uniform2f(U.uM, mouse.x*DPR, (cvH - mouse.y)*DPR);
  gl.uniform1f(U.uMS, mouse.s);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

const fx = $('#fx'), cx = fx.getContext('2d');
let FW=0, FH=0, FD=1, parts=[], spriteD=null, spriteL=null;
const GLY = [...'𓂀𓋹𓇳𓆣𓅃𓃠𓊹𓉴𓋴𓈖𓆄𓇋𓁹𓎛𓊨𓄤𓏞𓇓'];

function fxSkin(){

  spriteL = spriteL || mkSprite('rgba(150,98,20,.95)','rgba(176,122,34,.35)');

let glyphCache = {}, FQ = 1;
function glyphSprite(ch, sz){

  const s = document.createElement('canvas'); const n = Math.ceil(sz*1.6); s.width = s.height = n;
  const g = s.getContext('2d');

function fxResize(){

  cx.setTransform(FD,0,0,FD,0,0);

  for(let i=0;i<nBok;i++) parts.push({k:1, x:Math.random()*FW, y:Math.random()*FH, z:0.3+Math.random()*0.7, ph:Math.random()*6.28, r:30+Math.random()*80});
  for(let i=0;i<nGly;i++) parts.push({k:2, x:Math.random()*FW, y:Math.random()*FH, z:0.3+Math.random()*0.7, ph:Math.random()*6.28, ch:GLY[i%GLY.length], sz:Math.round((26+Math.random()*60)/8)*8, rot:(Math.random()-.5)*0.6});

let vel = 0, lastSY = scrollY, fmx=-9999, fmy=-9999;
addEventListener('mousemove', e=>{ fmx=e.clientX; fmy=e.clientY; }, {passive:true});
function fxFrame(t, dt){

  vel += (Math.max(-30,Math.min(30,dv)) - vel) * 0.15;

    if(p.k===0){

      p.x += Math.sin(sec*0.6 + p.ph)*0.25*p.z;

      if(p.x<-20) p.x=FW+20; if(p.x>FW+20) p.x=-20;
      const tw = 0.5+0.5*Math.sin(sec*2.2*p.sp + p.ph);
      const a = (light?0.55:0.75) * p.z * (0.35+0.65*tw);
      const s = (1.2 + 3.2*p.z) * (light?1.1:1);
      cx.globalAlpha = a;
      cx.drawImage(sp, p.x - s*3, p.y - s*3, s*6, s*6);
      const streak = Math.min(36, Math.abs(vel)*p.z*0.9);
      if(streak>4){ cx.globalAlpha=a*0.4; cx.drawImage(sp, p.x - s*0.5, Math.min(p.y, p.y + Math.sign(vel)*streak), s, streak); }
    } else if(p.k===1){
      p.y -= 0.05*dt*0.06*p.z + vel*p.z*0.12;
      p.x += Math.sin(sec*0.15 + p.ph)*0.15;
      if(p.y<-p.r*2){ p.y=FH+p.r; } if(p.y>FH+p.r*2){ p.y=-p.r; }
      cx.globalAlpha = (light?0.10:0.13) * p.z * (0.6+0.4*Math.sin(sec*0.5+p.ph));
      cx.drawImage(sp, p.x-p.r, p.y-p.r, p.r*2, p.r*2);
    } else {
      p.y -= 0.12*dt*0.06*p.z + vel*p.z*0.28;
      p.x += Math.sin(sec*0.2 + p.ph)*0.2;
      if(p.y<-120){ p.y=FH+100; p.x=Math.random()*FW; } if(p.y>FH+120){ p.y=-100; p.x=Math.random()*FW; }
      const gs = glyphSprite(p.ch, p.sz), rr = p.rot + Math.sin(sec*0.3+p.ph)*0.25, cs = Math.cos(rr), sn = Math.sin(rr);
      cx.globalCompositeOperation = 'source-over';
      cx.globalAlpha = (light?0.13:0.16) * p.z * (inStory?1:0.5);
      cx.setTransform(cs*FD, sn*FD, -sn*FD, cs*FD, p.x*FD, p.y*FD);
      cx.drawImage(gs, -gs.width/2, -gs.height/2);
      cx.setTransform(FD,0,0,FD,0,0);
      cx.globalCompositeOperation = light ? 'source-over' : 'lighter';
    }
  }
  cx.globalAlpha = 1;
}

function frame(t){

let pAcc = 0, pN = 0, pLast = performance.now(), pLevel = 0;
function perf(dt){
  pAcc += dt; pN++;
  const now = performance.now();
  if (now - pLast < 1500) return;
  const avg = pAcc / pN; pAcc = 0; pN = 0; pLast = now;
  if (document.hidden || !loadedAll) return;
  if (avg > 22 && pLevel < 3){
    pLevel++;
    QS = [1, .8, .65, .5][pLevel]; if(glOK) resize(); lastGLs = -1;
    FQ = [1, .7, .45, .3][pLevel]; fxResize();
  }
}

function toGlyphs(str){
  let lat=''; for(const ch of str.toLowerCase()){ if(UK[ch]!==undefined) lat+=UK[ch]; else if(/[a-z]/.test(ch)) lat+=ch; }
  const out=[]; let i=0;
  while(i<lat.length){ const two=lat.slice(i,i+2); if(['sh','ch','kh','zh'].includes(two)){ out.push([GLM[two],two]); i+=2; continue; } const c=lat[i]; if(GLM[c]) out.push([GLM[c],c]); i++; }
  return out;
}

let qi=0, score=0, finished=false, answered=-1;
function renderQuiz(){
  const Q = QUIZ[lang], t = L();
  if(finished){
    $('#qNum').textContent=t.done; $('#qScore').textContent=`${t.pts}: ${score}`;
    $('#qText').textContent=`${score} ${t.of} ${Q.length} · ${t.titles[score]}`; $('#qOpts').innerHTML='';
    $('#qExp').textContent = score===Q.length ? t.perfect : t.retry;
    $('#qNext').hidden=false; $('#qNext').textContent=t.again; return;
  }
  const q=Q[qi];
  $('#qNum').textContent=`${t.q} ${qi+1} / ${Q.length}`; $('#qScore').textContent=`${t.pts}: ${score}`;
  $('#qText').textContent=q.q;
  $('#qOpts').innerHTML=q.o.map((o,i)=>`<button class="qopt" type="button" id="qo${i}" data-i="${i}">${o}</button>`).join('');
  if(answered>=0){ markAnswer(answered,false); } else { $('#qExp').textContent=''; $('#qNext').hidden=true; }
}
function markAnswer(i, count){
  const Q = QUIZ[lang], q=Q[qi], t=L();
  document.querySelectorAll('.qopt').forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add('right'); if(k===i && i!==q.a) x.classList.add('wrong'); });
  if(count && i===q.a) score++;
  $('#qExp').textContent = (i===q.a ? t.right : t.wrong) + q.e;
  $('#qScore').textContent=`${t.pts}: ${score}`;
  $('#qNext').hidden=false; $('#qNext').textContent = qi===Q.length-1 ? t.result : t.next;
}

});

function buildExtras(){
  const t = L(), en = lang==='en';
  /* menu */
  const M = [['#story','mFilm'],['#stats','mStats'],['#pharaohs','mPh'],['#gods','mGods'],['#journey','mJr'],['#afterlife','mAf'],['#museum','mMu'],['#eras','mEras'],['#name','mName'],['#quiz','mQuiz']];
  $('#menuList').innerHTML = M.map((m,i)=>`<li><a href="${m[0]}" style="transition-delay:${i*40}ms"><small>${String(i+1).padStart(2,'0')}</small>${t[m[1]]}</a></li>`).join('');
  $('#menuBtn span').textContent = t.menu;
  /* stats */
  $('#statGrid').innerHTML = STATS.map((s,i)=>`<div class="stat rv"><span class="sg glyph" aria-hidden="true">${s.g}</span><div class="num gold" data-n="${s.n}" data-suf="${en && s.suf2 ? s.suf2 : s.suf}">${fmtN(statDone[i] ? s.n : 0)}${en && s.suf2 ? s.suf2 : s.suf}</div><div class="lab">${s[lang][0]}</div><p>${s[lang][1]}</p></div>`).join('');
  /* marquee */
  const row = arr => { const h = arr.map(f=>`<span>${f}<i>𓋹</i></span>`).join(''); return h + h; };
  $('#mq1').innerHTML = row(FACTS[lang].slice(0,5)); $('#mq2').innerHTML = row(FACTS[lang].slice(5));
  /* carousel */
  $('#carTrack').innerHTML = PHS.map(p=>{ const d=p[lang]; return `<article class="pc"><div class="ph"><img src="${GI(p.k)}" alt="${d[1]}" loading="lazy" draggable="false"><span class="crt" aria-hidden="true">${p.c}</span><span class="yrs">${d[0]}</span></div><h3>${d[1]}</h3><div class="tag">${d[2]}</div><p>${d[3]}</p></article>`; }).join('');
  $('#carPrev').setAttribute('aria-label', t.prev); $('#carNext').setAttribute('aria-label', t.next2);
  /* gods */
  $('#godGrid').innerHTML = GODS.map((g,i)=>{ const d=g[lang]; return `<button type="button" class="flip rv" aria-label="${d[0]}: ${t.flip}" aria-pressed="false" style="transition-delay:${(i%3)*80}ms"><div class="in"><div class="f"><img src="${GI(g.k)}" alt="" loading="lazy"><span class="turn" aria-hidden="true">${ICON_TURN}</span><div class="cap"><small>${d[1]}</small><b>${d[0]}</b></div></div><div class="b"><span class="bg glyph gold" aria-hidden="true">${g.g}</span><div style="display:grid;gap:8px"><small>${d[1]}</small><h3>${d[0]}</h3><p>${d[2]}</p></div></div></div></button>`; }).join('');
  /* journey */
  $('#hzTrack').innerHTML = PLACES.map((p,i)=>{ const d=p[lang]; return `<article class="slide"><button type="button" class="im" data-lb="place:${i}" aria-label="${t.open}: ${d[1]}"><img src="${GI(p.k)}" alt="${d[1]}" loading="lazy"></button><div class="tx"><span class="no gold">${String(i+1).padStart(2,'0')}</span><span class="loc">${d[0]}</span><h3>${d[1]}</h3><p>${d[2]}</p></div></article>`; }).join('');
  /* afterlife */
  $('#afVis').innerHTML = AFTER.map((a,i)=>`<img src="${a.src||GI(a.k)}" alt="" loading="lazy" class="${i===afIdx?'on':''}">`).join('') + `<span class="day" id="afDay">${AFTER[afIdx].d}</span>`;
  $('#afSteps').innerHTML = AFTER.map((a,i)=>{ const d=a[lang]; return `<div class="st2${i===afIdx?' on':''}" data-i="${i}"><span class="d">${d[0]}</span><h3>${d[1]}</h3><p>${d[2]}</p></div>`; }).join('');
  /* museum */
  $('#museumGrid').innerHTML = MUSEUM.map((m,i)=>{ const d=m[lang]; return `<button type="button" class="mi rv" data-lb="mus:${i}" aria-label="${t.open}: ${d[0]}"><img src="${GI(m.k)}" alt="${d[0]}" loading="lazy"><span class="cap"><small>${d[1]}</small><b>${d[0]}</b></span></button>`; }).join('');
  wireExtras();
}
function fmtN(n){ return Math.round(n).toLocaleString(lang==='en'?'en-US':'uk-UA'); }

/* ---- behaviours (wired once, re-bound after rebuild where needed) ---- */
let wired = false, statDone = STATS.map(()=>false), afIdx = 0;
function wireExtras(){
  /* reveal for new nodes */
  document.querySelectorAll('#statGrid .rv, #godGrid .rv, #museumGrid .rv').forEach(el=>{ if(el.getBoundingClientRect().top > innerHeight){ el.classList.add('hide'); io.observe(el); } });
  /* stats count-up */
  document.querySelectorAll('#statGrid .num').forEach((el,i)=>{ if(statDone[i]) return; statIO.observe(el); });
  /* gods flip */
  document.querySelectorAll('.flip').forEach(b=>b.addEventListener('click',()=>{ const on=!b.classList.contains('on'); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }));
  /* afterlife steps */
  document.querySelectorAll('#afSteps .st2').forEach(el=>afIO.observe(el));
  carUpdate(); hzSize();
  if(wired) return; wired = true;
  new IntersectionObserver(es=>{ hzNear = es[0].isIntersecting; if(hzNear) hzSize(); },{rootMargin:'200px 0px'}).observe($('#journey'));
  addEventListener('load', hzSize);
  /* menu */
  $('#menuBtn').addEventListener('click', ()=>setMenu(!document.body.classList.contains('menu-open')));
  $('#menu').addEventListener('click', e=>{ const a=e.target.closest('a'); if(!a) return; e.preventDefault(); setMenu(false); const t=document.querySelector(a.getAttribute('href')); stopPlay(); setTimeout(()=>{ lenis? lenis.scrollTo(t,{duration:1.6}) : t.scrollIntoView({behavior:RM?'auto':'smooth'}); }, 350); });
  addEventListener('keydown', e=>{ if(e.key==='Escape'){ setMenu(false); lbClose(); } if($('#lb').classList.contains('on')){ if(e.key==='ArrowRight') lbStep(1); if(e.key==='ArrowLeft') lbStep(-1); } });
  /* carousel */
  const car = $('#car');
  car.addEventListener('scroll', carUpdate, {passive:true});
  let dx=0, sx=0, sl=0, down=false, moved=false;
  car.addEventListener('pointerdown', e=>{ if(e.pointerType!=='mouse') return; down=true; moved=false; sx=e.clientX; sl=car.scrollLeft; car.classList.add('drag'); carHold(); });
  addEventListener('pointermove', e=>{ if(!down) return; dx=e.clientX-sx; if(Math.abs(dx)>4) moved=true; car.scrollLeft = sl - dx; });
  addEventListener('pointerup', ()=>{ if(!down) return; down=false; car.classList.remove('drag'); const w=cardW(); car.scrollTo({left:Math.round(car.scrollLeft/w)*w, behavior:'smooth'}); });
  car.addEventListener('click', e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); } }, true);
  car.addEventListener('mouseenter', carHold); car.addEventListener('touchstart', carHold, {passive:true});
  $('#carPrev').addEventListener('click', ()=>{ carHold(); car.scrollBy({left:-cardW(), behavior:'smooth'}); });
  $('#carNext').addEventListener('click', ()=>{ carHold(); carAdvance(); });
  new IntersectionObserver(es=>{ carVisible = es[0].isIntersecting; }).observe(car);
  setInterval(()=>{ if(carVisible && !RM && performance.now() > carHoldUntil && !document.hidden) carAdvance(); }, 3800);
  /* lightbox */
  document.addEventListener('click', e=>{ const b=e.target.closest('[data-lb]'); if(!b) return; const [kind,i]=b.dataset.lb.split(':'); lbOpen(kind, +i); });
  $('#lbX').addEventListener('click', lbClose); $('#lbP').addEventListener('click', ()=>lbStep(-1)); $('#lbN').addEventListener('click', ()=>lbStep(1));
  $('#lb').addEventListener('click', e=>{ if(e.target.id==='lb' || e.target.tagName==='FIGURE') lbClose(); });
  addEventListener('resize', ()=>{ hzSize(); carUpdate(); });
}
function setMenu(on){
  document.body.classList.toggle('menu-open', on);
  $('#menuBtn').setAttribute('aria-expanded', on);
  $('#menu').setAttribute('aria-hidden', !on);
  $('#menu').inert = !on;
  if(on) stopPlay();
}
/* stats */
const statIO = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return; statIO.unobserve(e.target);
  const el=e.target, n=+el.dataset.n, suf=el.dataset.suf, i=[...document.querySelectorAll('#statGrid .num')].indexOf(el);
  if(RM){ el.textContent = fmtN(n)+suf; statDone[i]=true; return; }
  const t0=performance.now(), dur=2200;
  (function tick(t){ const p=Math.min(1,(t-t0)/dur), e2=1-Math.pow(1-p,4); el.textContent = fmtN(n*e2)+suf; if(p<1) requestAnimationFrame(tick); else statDone[i]=true; })(t0);
}),{threshold:.4});
/* carousel */
let carVisible=false, carHoldUntil=0;
function carHold(){ carHoldUntil = performance.now() + 9000; }
function cardW(){ const c=document.querySelector('.pc'); return c ? c.getBoundingClientRect().width + 22 : 300; }
function carAdvance(){ const car=$('#car'); if(car.scrollLeft + car.clientWidth >= car.scrollWidth - 8) car.scrollTo({left:0, behavior:'smooth'}); else car.scrollBy({left:cardW(), behavior:'smooth'}); }
function carUpdate(){
  const car=$('#car'); if(!car) return;
  const mid = car.getBoundingClientRect().left + car.clientWidth/2;
  const cards=[...car.querySelectorAll('.pc')]; let best=0, bd=1e9;
  cards.forEach((c,i)=>{ const r=c.getBoundingClientRect(); const d=(r.left + r.width/2 - mid)/r.width; if(Math.abs(d)<bd){bd=Math.abs(d);best=i;}
    const a=Math.max(-2,Math.min(2,d));
    c.style.transform = RM ? '' : `translateZ(${(-Math.abs(a)*60).toFixed(1)}px) rotateY(${(-a*14).toFixed(2)}deg) translateY(${(Math.abs(a)*18).toFixed(1)}px)`;
    c.style.opacity = (1 - Math.min(0.55, Math.abs(a)*0.28)).toFixed(3); });
  $('#carCnt').textContent = String(best+1).padStart(2,'0') + ' / ' + String(cards.length).padStart(2,'0');
  const max = car.scrollWidth - car.clientWidth; $('#carBar').style.transform = `scaleX(${max>0 ? (car.scrollLeft/max) : 0})`;
}
/* journey (horizontal pinned) */
let hzDist = 0, hzTop = 0, hzH = 0, hzSlides = [], hzLastP = -1, hzNear = false;
function hzSize(){
  const sec=$('#journey'), tr=$('#hzTrack'); if(!sec||!tr) return;
  hzDist = Math.max(0, tr.scrollWidth - innerWidth);
  sec.style.height = (innerHeight + hzDist) + 'px';
  hzTop = sec.getBoundingClientRect().top + scrollY; hzH = innerHeight + hzDist;
  hzSlides = [...tr.querySelectorAll('.slide')].map(sl=>({img: sl.querySelector('img'), c: sl.offsetLeft + sl.offsetWidth*0.3}));
  hzLastP = -1;
}
function hzFrame(){
  if(!hzNear) return;
  const p = Math.min(1, Math.max(0, (scrollY - hzTop) / Math.max(1, hzH - innerHeight)));
  if (Math.abs(p - hzLastP) < 0.0002) return; hzLastP = p;
  const x = p*hzDist;
  $('#hzTrack').style.transform = `translate3d(${(-x).toFixed(1)}px,0,0)`;
  $('#hzBar').style.transform = `scaleX(${p.toFixed(4)})`;
  if(!RM) hzSlides.forEach(s=>{ if(!s.img) return; const c=(s.c - x - innerWidth/2)/innerWidth; if(c<-1.2||c>1.2) return; s.img.style.transform = `translate3d(${(-c*10).toFixed(2)}%,0,0)`; });
}
/* afterlife */
const afIO = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return; const i=+e.target.dataset.i; if(i===afIdx) return; afIdx=i;
  document.querySelectorAll('#afSteps .st2').forEach((s,k)=>s.classList.toggle('on',k===i));
  document.querySelectorAll('#afVis img').forEach((im,k)=>im.classList.toggle('on',k===i));
  const dd=$('#afDay'); if(dd) dd.textContent = AFTER[i].d;
}),{rootMargin:'-45% 0px -45% 0px'});
/* lightbox */
let lbList=[], lbI=0;
function lbItems(kind){
  if(kind==='mus') return MUSEUM.map(m=>({src:GI(m.k), t:m[lang][0], s:m[lang][1]+' · '+m[lang][2], c:m.k}));
  return PLACES.map(p=>({src:GI(p.k), t:p[lang][1], s:p[lang][0]+' · '+p[lang][2], c:p.k}));
}
function lbOpen(kind,i){ lbList=lbItems(kind); lbI=i; lbShow(); const lb=$('#lb'); lb.classList.add('on'); lb.setAttribute('aria-hidden','false'); lb.inert=false; stopPlay(); if(lenis) lenis.stop(); $('#lbX').focus(); }
function lbClose(){ const lb=$('#lb'); if(!lb.classList.contains('on')) return; lb.classList.remove('on'); lb.setAttribute('aria-hidden','true'); lb.inert=true; if(lenis) lenis.start(); }
function lbStep(d){ lbI=(lbI+d+lbList.length)%lbList.length; lbShow(); }
function lbShow(){ const it=lbList[lbI], t=L(); $('#lbImg').src=it.src; $('#lbImg').alt=it.t; $('#lbT').textContent=it.t; $('#lbS').textContent=it.s; $('#lbC').innerHTML=`${t.photoBy}: <a href="${crUrl(it.c)}" target="_blank" rel="noopener" style="color:inherit">${crTxt(it.c)}</a>`;
  $('#lbX').setAttribute('aria-label',t.close); $('#lbP').setAttribute('aria-label',t.prev); $('#lbN').setAttribute('aria-label',t.next2); }

/* ================= INIT ================= */
setSkin(skin);
fxResize();
setLang(lang);
})();
</script>
</body>
